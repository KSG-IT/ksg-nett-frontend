name: Deploy development

on:
  push:
    branches: [master]

env:
  AWS_DEFAULT_REGION: eu-west-3
  AWS_DEFAULT_OUTPUT: json
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TAG: ${{ github.sha }}
  PROJECT_NAME: ksg-nett

jobs:
  changes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Show the changes in this deploy
        env:
          BEFORE: ${{ github.event.before }}
        run: .github/scripts/release-diff.sh "$BEFORE" "$GITHUB_SHA"

  test:
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-24.04
    needs: [test]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          # Yarn comes from corepack later. No automatic cache from packageManager.
          package-manager-cache: false
          node-version: 22.16.0
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2 # default
          verbose: false # default
          arch: amd64 # allowed values: amd64, arm64
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Deploy development
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn deploy:development
