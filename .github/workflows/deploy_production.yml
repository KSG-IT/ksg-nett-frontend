name: Deploy production

# Production deploys on a version tag, for example v2026.10.3. The tag must be
# on master. See ksg-nett-knowledge-base/plans/single-branch-master.md.
on:
  push:
    tags: ['v*']

env:
  AWS_DEFAULT_REGION: eu-west-3
  AWS_DEFAULT_OUTPUT: json
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TAG: ${{ github.sha }}

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master

  test:
    needs: [check-tag]
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-latest
    needs: [test]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2 # default
          verbose: false # default
          arch: amd64 # allowed values: amd64, arm64
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Deploy production
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn deploy:production
