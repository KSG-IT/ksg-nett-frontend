name: Deploy production

# Production deploys on a version tag, for example v2026.10.3. The tag must be
# on master. See ksg-nett-knowledge-base/plans/single-branch-master.md.
# The Release workflow starts this run on its tag with workflow_dispatch,
# because a tag it pushes starts no workflow. A hotfix tag is not on master,
# but must start from the latest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      hotfix:
        description: The tag is a hotfix on top of the latest release, not on master
        type: boolean
        default: false

env:
  AWS_DEFAULT_REGION: eu-west-3
  AWS_DEFAULT_OUTPUT: json
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TAG: ${{ github.sha }}

jobs:
  check-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check that the tag is on master, or a hotfix on the latest release
        env:
          HOTFIX: ${{ inputs.hotfix }}
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Run this on a version tag, not on $GITHUB_REF_NAME."
            exit 1
          fi
          if [ "$HOTFIX" = "true" ]; then
            previous="$(git tag --list 'v*' --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)"
            git merge-base --is-ancestor "$previous" "$GITHUB_SHA" \
              || { echo "::error::A hotfix must start from the latest release $previous."; exit 1; }
          else
            git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          fi
      # The summary is ready before the reviewer approves the build job.
      - name: Show the changes since the previous release
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          .github/scripts/release-diff.sh "$previous" "$GITHUB_SHA"

  test:
    needs: [check-tag]
    uses: ./.github/workflows/tests.yml

  build:
    runs-on: ubuntu-24.04
    needs: [test]
    # The environment has required reviewers. The run waits here, after the
    # tests, until a reviewer approves it in the Actions tab.
    environment: production

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          # Yarn comes from corepack later. No automatic cache from packageManager.
          package-manager-cache: false
          node-version: 22.16.0
      - id: install-aws-cli
        uses: unfor19/install-aws-cli-action@v1
        with:
          version: 2 # default
          verbose: false # default
          arch: amd64 # allowed values: amd64, arm64
      - name: Enable corepack
        run: corepack enable
      - name: Install dependencies
        run: yarn install --immutable
      - name: Deploy production
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: yarn deploy:production

  release:
    runs-on: ubuntu-24.04
    needs: [build]
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
